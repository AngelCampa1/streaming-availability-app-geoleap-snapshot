services:
  redis:
    image: redis:7-alpine
    container_name: geoleap-redis-local
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --protected-mode no
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: geoleap-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-GeoLeap123!}
      - POSTGRES_DB=GeoLeap_Dev
    ports:
      - "9020:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
