version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    container_name: geoleap-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GeoLeap123!}
      POSTGRES_DB: "GeoLeap_Dev"
    ports:
      - "9020:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - geoleap-network

  # Redis Cache
  redis:
    container_name: geoleap-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - geoleap-network

  # Backend API (.NET)
  backend:
    container_name: geoleap-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8020:8020"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8020
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=GeoLeap_Dev;Username=postgres;Password=${POSTGRES_PASSWORD:-GeoLeap123!}
      - ConnectionStrings__Redis=redis:6379
      - JWT__Secret=${JWT__Secret:?Set JWT__Secret for local development; production uses docker-compose.prod.yml}
      - JWT__Issuer=GeoLeap.Api.Dev
      - JWT__Audience=GeoLeap.Client.Dev
      - ENABLE_HANGFIRE=false
      - ENABLE_BACKGROUND_SERVICES=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8020/health/live || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - geoleap-network

  # Frontend (Next.js)
  frontend:
    container_name: geoleap-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3020:3020"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8020
      - INTERNAL_API_URL=http://backend:8020
      - PORT=3020
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:?Set STRIPE_PUBLISHABLE_KEY for local development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3020 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - geoleap-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  geoleap-network:
    driver: bridge
